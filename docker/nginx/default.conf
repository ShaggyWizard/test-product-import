server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker: адрес app берётся заново, а не один раз при старте nginx.
    # Иначе после пересоздания контейнера app nginx стучится на старый IP и отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    # API -> PHP-FPM (Slim, единая точка входа public/index.php)
    location /api/ {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Скачанные при импорте картинки
    location /media/ {
        alias /var/www/app/public/media/;
        expires 7d;
        access_log off;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
