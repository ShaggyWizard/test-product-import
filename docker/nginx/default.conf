server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # API -> PHP-FPM (Slim, единая точка входа public/index.php)
    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Скачанные при импорте картинки
    location /media/ {
        alias /var/www/app/public/media/;
        expires 7d;
        access_log off;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
